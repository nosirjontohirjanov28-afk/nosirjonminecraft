  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="6" />
  <!-- Isometric Voxel Cube -->
  <polygon points="256,96 400,176 256,256 112,176" fill="url(#topFace)" stroke="#bae6fd" stroke-width="4" />
  <polygon points="112,176 256,256 256,416 112,336" fill="url(#leftFace)" stroke="#38bdf8" stroke-width="4" />
  <polygon points="400,176 256,256 256,416 400,336" fill="url(#rightFace)" stroke="#38bdf8" stroke-width="4" />
  <!-- Inner neon voxel core -->
  <polygon points="256,144 336,188 256,232 176,188" fill="#e0f2fe" fill-opacity="0.45" />
  <rect x="160" y="244" width="44" height="44" rx="4" fill="#38bdf8" fill-opacity="0.35" transform="skewY(28)" />
